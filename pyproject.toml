[project]
name = "fde-auto-fnol-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]
azure = [
    "azure-identity>=1.19.0",
    "azure-storage-blob>=12.24.0",
    "pyodbc>=5.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
