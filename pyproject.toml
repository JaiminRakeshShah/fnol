[project]
name = "fde-auto-fnol-training"
version = "1.0.0"
description = "Fictional Associate FDE capstone simulator and fixtures"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "tools"]
